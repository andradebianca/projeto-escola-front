<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ABC - Boletim</title>

    <link rel="stylesheet" href="../style/global.css" />

    <link rel="stylesheet" href="./style/notas.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="app-container">
      <!-- HEADER -->
      <header class="top-header">
        <div class="logo-area">
          <h1 class="logo">ABC<span>.</span></h1>

          <div class="logo-divider"></div>

          <p class="portal-text">Portal do Aluno</p>
        </div>

        <button class="logout-btn-header" id="btn-sair">
          Sair

          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </header>

      <!-- DASHBOARD -->
      <div class="dashboard-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
          <div class="profile">
            <div class="avatar">
              <i class="fa-solid fa-user"></i>
            </div>

            <h2 id="nome-aluno"></h2>

            <span id="matricula-aluno"></span>
          </div>

          <nav class="menu">
            <button class="menu-btn" id="dashboard">
              <i class="fa-solid fa-table-columns"></i>
              DashBoard
            </button>

            <button class="menu-btn" id="dados-pessoais">
              <i class="fa-solid fa-user"></i>
              Dados Pessoais
            </button>

            <button class="menu-btn active" id="boletins">
              <i class="fa-solid fa-star"></i>
              Boletins
            </button>
          </nav>
        </aside>

        <!-- CONTENT -->
        <main class="main-content">
          <div class="page-content-card default-card" id="boletim-container">
            <div class="page-title">
              <h2>Boletim Escolar</h2>

              <p>Visualize todas as suas notas</p>
            </div>

            <section class="disciplinas-list" id="disciplinas-list">
              <p>Carregando...</p>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="./script/global.js" type="module"></script>

    <script src="./script/notas.js" type="module"></script>
  </body>
</html>
