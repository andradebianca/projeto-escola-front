<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ABC - Portal do Aluno</title>

    <link rel="stylesheet" href="../style/global.css" />
    <link rel="stylesheet" href="./style/main.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="app-container">
      <!-- HEADER -->
      <header class="top-header">
        <div class="logo-area">
          <h1 class="logo">ABC<span>.</span></h1>

          <div class="logo-divider"></div>

          <p class="portal-text">Portal do Aluno</p>
        </div>

        <button class="logout-btn-header" id="btn-sair">
          Sair

          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </header>

      <!-- DASHBOARD -->
      <div class="dashboard-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
          <div class="profile">
            <div class="avatar">
              <i class="fa-solid fa-user"></i>
            </div>

            <h2>Nome aluno</h2>

            <span>matrícula</span>
          </div>

          <nav class="menu">
            <button class="menu-btn active">
              <i class="fa-solid fa-table-columns"></i>
              DashBoard
            </button>

            <button class="menu-btn">
              <i class="fa-solid fa-user"></i>
              Dados Pessoais
            </button>

            <button class="menu-btn">
              <i class="fa-solid fa-star"></i>
              Boletins
            </button>
          </nav>
        </aside>

        <!-- CONTENT -->
        <main class="main-content">
          <select class="semester">
            <option>2026/1</option>
            <option>2025/2</option>
          </select>

          <section class="cards">
            <div class="subject-card default-card">
              <h3>Disciplina 1</h3>
              <p>Professor:</p>
            </div>

            <div class="subject-card default-card">
              <h3>Disciplina 2</h3>
              <p>Professor:</p>
            </div>

            <div class="subject-card default-card">
              <h3>Disciplina 3</h3>
              <p>Professor:</p>
            </div>

            <div class="subject-card default-card">
              <h3>Disciplina 4</h3>
              <p>Professor:</p>
            </div>

            <div class="subject-card default-card">
              <h3>Disciplina 5</h3>
              <p>Professor:</p>
            </div>

            <div class="subject-card default-card">
              <h3>Disciplina 6</h3>
              <p>Professor:</p>
            </div>

            <div class="subject-card default-card">
              <h3>Disciplina 7</h3>
              <p>Professor:</p>
            </div>

            <div class="subject-card default-card">
              <h3>Disciplina 8</h3>
              <p>Professor:</p>
            </div>

            <div class="subject-card default-card">
              <h3>Disciplina 10</h3>
              <p>Professor:</p>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="/script/funcs-global.js" type="module"></script>
  </body>
</html>
