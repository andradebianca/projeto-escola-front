<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ABC - Portal do Aluno</title>

    <link rel="stylesheet" href="../style/global.css" />
    <link rel="stylesheet" href="./style/main.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="icon" href="./../img/icons/book.png" type="image/x-icon" />
  </head>

  <body>
    <div class="app-container">
      <!-- HEADER -->
      <header class="top-header">
        <div class="logo-area">
          <h1 class="logo">ABC<span>.</span></h1>

          <div class="logo-divider"></div>

          <p class="portal-text">Portal do Aluno</p>
        </div>

        <button class="logout-btn-header" id="btn-sair">
          Sair

          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </header>

      <!-- DASHBOARD -->
      <div class="dashboard-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
          <div class="profile">
            <div class="avatar">
              <i class="fa-solid fa-user"></i>
            </div>

            <h2 id="nome-aluno"></h2>

            <span id="matricula-aluno"></span>
          </div>

          <nav class="menu">
            <button class="menu-btn active" id="dashboard">
              <i class="fa-solid fa-table-columns"></i>
              DashBoard
            </button>

            <button class="menu-btn" id="dados-pessoais">
              <i class="fa-solid fa-user"></i>
              Dados Pessoais
            </button>

            <button class="menu-btn" id="boletins">
              <i class="fa-solid fa-star"></i>
              Boletins
            </button>
          </nav>
        </aside>

        <!-- CONTENT -->
        <div class="page-content-card default-card">
          <main class="main-content">
            <div class="page-title">
              <h2>DashBoard</h2>

              <p>Visualize o resumo de todas as notas</p>
            </div>

            <select class="semester" id="select-ano">
              <option>Carregando opções...</option>
            </select>

            <section class="cards" id="cards-disciplinas"></section>
          </main>
        </div>
      </div>
    </div>
    <script src="./script/main.js" type="module"></script>
    <script src="./script/global.js" type="module"></script>
  </body>
</html>
