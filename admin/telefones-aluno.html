<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ABC - Admin Telefones Aluno</title>

    <link rel="stylesheet" href="../style/global.css" />
    <link rel="stylesheet" href="./style/resource.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="icon" href="./../img/icons/book.png" type="image/x-icon" />
  </head>

  <body>
    <div class="app-container">
      <header class="top-header">
        <div class="logo-area">
          <h1 class="logo">ABC<span>.</span></h1>
          <div class="logo-divider"></div>
          <p class="portal-text">Portal do Administrador</p>
        </div>

        <button class="logout-btn-header" id="btn-sair">
          Sair
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </header>

      <div class="dashboard-container">
        <aside class="sidebar">
          <div class="profile">
            <div class="avatar">
              <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 id="nome-admin">Administrador</h2>
            <span id="email-admin">admin@escola</span>
          </div>

          <nav class="menu">
            <button class="menu-btn" id="menu-dashboard"><i class="fa-solid fa-table-columns"></i>Dashboard</button>
            <button class="menu-btn" id="menu-alunos"><i class="fa-solid fa-graduation-cap"></i>Alunos</button>
            <button class="menu-btn" id="menu-professores"><i class="fa-solid fa-chalkboard-user"></i>Professores</button>
            <button class="menu-btn" id="menu-turmas"><i class="fa-solid fa-users-rectangle"></i>Turmas</button>
            <button class="menu-btn" id="menu-disciplinas"><i class="fa-solid fa-book-open"></i>Disciplinas</button>
            <button class="menu-btn" id="menu-especializacoes"><i class="fa-solid fa-award"></i>Especializacoes</button>
            <button class="menu-btn" id="menu-enderecos"><i class="fa-solid fa-location-dot"></i>Enderecos</button>
            <button class="menu-btn active" id="menu-telefones-aluno"><i class="fa-solid fa-phone"></i>Telefones Aluno</button>
            <button class="menu-btn" id="menu-telefones-professor"><i class="fa-solid fa-phone-volume"></i>Telefones Professor</button>
            <button class="menu-btn" id="menu-vinculos-turma-disciplina"><i class="fa-solid fa-link"></i>Turma x Disciplina</button>
            <button class="menu-btn" id="menu-vinculos-professor-especializacao"><i class="fa-solid fa-diagram-project"></i>Professor x Especializacao</button>
          </nav>
        </aside>

        <main class="main-content">
          <div class="page-content-card default-card">
            <div class="page-title">
              <h2>Telefones de Alunos</h2>
              <p>Gerencie contatos dos alunos</p>
            </div>

            <div class="toolbar">
              <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="input-pesquisa" placeholder="Pesquisar aluno ou telefone..." />
              </div>

              <button class="new-btn" id="btn-novo">
                <i class="fa-solid fa-plus"></i>
                Novo Telefone
              </button>
            </div>

            <section class="records-list" id="records-list">
              <p>Carregando telefones...</p>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modal-title">Novo Telefone</h3>
          <button class="close-modal" id="close-modal"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="modal-body">
          <div class="input-group full" id="field-fk_aluno">
            <label>Aluno <span class="required">*</span></label>
            <select id="input-fk_aluno"><option value="">Selecione...</option></select>
          </div>

          <div class="input-group full" id="field-telefone">
            <label>Telefone <span class="required">*</span></label>
            <input type="text" id="input-telefone" />
          </div>

          <button class="delete-btn" id="btn-excluir">Excluir Telefone</button>
          <button class="save-btn" id="btn-salvar">Salvar Telefone</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="details-overlay">
      <div class="modal details-modal">
        <div class="modal-header">
          <h3>Detalhes do Telefone</h3>
          <button class="close-modal" id="close-details-modal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="details-grid" id="details-grid"></div>
      </div>
    </div>

    <script src="./script/global.js" type="module"></script>
    <script src="./script/telefones-aluno.js" type="module"></script>
  </body>
</html>
