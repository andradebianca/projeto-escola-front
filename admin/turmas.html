<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>ABC - Gerenciar Turmas</title>
    <link rel="stylesheet" href="../style/global.css" />
    <link rel="stylesheet" href="./style/resource.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-container">
      <header class="top-header">
        <div class="logo-area">
          <h1 class="logo">ABC<span>.</span></h1>
          <div class="logo-divider"></div>
          <p class="portal-text">Painel Administrativo</p>
        </div>
        <button class="logout-btn-header" id="btn-sair">
          Sair <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </header>
      <div class="dashboard-container">
        <aside class="sidebar"></aside>
        <main class="main-content">
          <div class="page-content-card">
            <div
              class="page-actions-header"
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
              "
            >
              <div class="page-title" style="margin: 0">
                <h2>Gerenciar Turmas</h2>
                <p>
                  Controle de salas, anos letivos vigentes e períodos de aulas.
                </p>
              </div>
              <button class="new-btn" id="btn-nova-turma">
                <i class="fa-solid fa-plus"></i> Nova Turma
              </button>
            </div>
            <div class="toolbar">
              <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i
                ><input
                  type="text"
                  id="input-pesquisa"
                  placeholder="Pesquisar turma por código ou turno..."
                />
              </div>
            </div>
            <section class="records-list" id="turmas-list">
              <p>Carregando turmas...</p>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modal-title">Nova Turma</h3>
          <button class="close-modal" id="close-modal">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="input-group">
            <label>Código da Turma <span class="required">*</span></label
            ><input
              type="text"
              id="input-cod-turma"
              placeholder="Ex: 3º Ano A"
            />
          </div>
          <div class="input-group">
            <label>Ano Letivo <span class="required">*</span></label
            ><input
              type="number"
              id="input-ano-letivo"
              min="2024"
              max="2100"
              value="2025"
            />
          </div>
          <div class="input-group">
            <label>Turno <span class="required">*</span></label>
            <select id="input-turno">
              <option value="">Selecione...</option>
              <option value="Matutino">Matutino</option>
              <option value="Vespertino">Vespertino</option>
              <option value="Noturno">Noturno</option>
            </select>
          </div>
          <button class="delete-btn" id="btn-excluir-turma">
            Excluir Turma
          </button>
          <button class="save-btn" id="btn-salvar-turma">Salvar Turma</button>
        </div>
      </div>
    </div>

    <script src="./script/global.js" type="module"></script>
    <script src="./script/turmas.js" type="module"></script>
  </body>
</html>
