<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ABC - Admin Professores</title>

    <link rel="stylesheet" href="../style/global.css" />
    <link rel="stylesheet" href="./style/resource.css" />
    <link rel="stylesheet" href="./style/professores.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="icon" href="./../img/icons/book.png" type="image/x-icon" />
  </head>

  <body>
    <div class="app-container">
      <header class="top-header">
        <div class="logo-area">
          <h1 class="logo">ABC<span>.</span></h1>

          <div class="logo-divider"></div>

          <p class="portal-text">Portal do Administrador</p>
        </div>

        <button class="logout-btn-header" id="btn-sair">
          Sair
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </header>

      <div class="dashboard-container">
        <aside class="sidebar">
          <div class="profile">
            <div class="avatar">
              <i class="fa-solid fa-user-shield"></i>
            </div>

            <h2 id="nome-admin">Administrador</h2>
            <span id="email-admin">admin@escola</span>
          </div>

          <nav class="menu">
            <button class="menu-btn" id="menu-dashboard">
              <i class="fa-solid fa-table-columns"></i>
              Dashboard
            </button>
            <button class="menu-btn" id="menu-alunos">
              <i class="fa-solid fa-graduation-cap"></i>
              Alunos
            </button>
            <button class="menu-btn active" id="menu-professores">
              <i class="fa-solid fa-chalkboard-user"></i>
              Professores
            </button>
            <button class="menu-btn" id="menu-turmas">
              <i class="fa-solid fa-users-rectangle"></i>
              Turmas
            </button>
            <button class="menu-btn" id="menu-disciplinas">
              <i class="fa-solid fa-book-open"></i>
              Disciplinas
            </button>
            <button class="menu-btn" id="menu-especializacoes">
              <i class="fa-solid fa-award"></i>
              Especializacoes
            </button>
            <button class="menu-btn" id="menu-enderecos">
              <i class="fa-solid fa-location-dot"></i>
              Enderecos
            </button>
            <button class="menu-btn" id="menu-telefones-aluno">
              <i class="fa-solid fa-phone"></i>
              Telefones Aluno
            </button>
            <button class="menu-btn" id="menu-telefones-professor">
              <i class="fa-solid fa-phone-volume"></i>
              Telefones Professor
            </button>
            <button class="menu-btn" id="menu-vinculos-turma-disciplina">
              <i class="fa-solid fa-link"></i>
              Turma x Disciplina
            </button>
            <button class="menu-btn" id="menu-vinculos-professor-especializacao">
              <i class="fa-solid fa-diagram-project"></i>
              Professor x Especializacao
            </button>
          </nav>
        </aside>

        <main class="main-content">
          <div class="page-content-card default-card">
            <div class="page-title">
              <h2>Gerenciar Professores</h2>
              <p>Cadastre, edite, visualize e remova professores</p>
            </div>

            <div class="toolbar">
              <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                  type="text"
                  id="input-pesquisa"
                  placeholder="Pesquisar professor por nome ou email..."
                />
              </div>

              <button class="new-btn" id="btn-novo-professor">
                <i class="fa-solid fa-plus"></i>
                Novo Professor
              </button>
            </div>

            <section class="records-list" id="professores-list">
              <p>Carregando professores...</p>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modal-title">Novo Professor</h3>

          <button class="close-modal" id="close-modal">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="modal-body">
          <div class="input-group" id="field-email">
            <label>Email <span class="required">*</span></label>
            <input type="email" id="input-email" />
          </div>

          <div class="input-group" id="field-user-name">
            <label>Usuario <span class="required">*</span></label>
            <input type="text" id="input-user-name" />
          </div>

          <div class="input-group" id="field-senha">
            <label>Senha <span class="required">*</span></label>
            <input type="text" id="input-senha" />
          </div>

          <div class="input-group" id="field-cpf">
            <label>CPF <span class="required">*</span></label>
            <input type="text" id="input-cpf" />
          </div>

          <div class="input-group full" id="field-nome-completo">
            <label>Nome Completo <span class="required">*</span></label>
            <input type="text" id="input-nome-completo" />
          </div>

          <div class="input-group" id="field-data-nascimento">
            <label>Data Nascimento <span class="required">*</span></label>
            <input type="date" id="input-data-nascimento" />
          </div>

          <div class="input-group" id="field-fk-endereco">
            <label>Endereco <span class="required">*</span></label>
            <select id="input-fk-endereco">
              <option value="">Selecione...</option>
            </select>
          </div>

          <button class="delete-btn" id="btn-excluir-professor">
            Excluir Professor
          </button>
          <button class="save-btn" id="btn-salvar-professor">
            Salvar Professor
          </button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="details-overlay">
      <div class="modal details-modal">
        <div class="modal-header">
          <h3>Detalhes do Professor</h3>

          <button class="close-modal" id="close-details-modal">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="details-grid" id="details-grid"></div>

        <div class="detail-extra">
          <h4>Especializacoes</h4>
          <div id="details-especializacoes"></div>
        </div>
      </div>
    </div>

    <script src="./script/global.js" type="module"></script>
    <script src="./script/professores.js" type="module"></script>
  </body>
</html>
