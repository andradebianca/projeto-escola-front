<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>ABC - Vínculos Prof x Especialização</title>
    <link rel="stylesheet" href="../style/global.css" />
    <link rel="stylesheet" href="./style/resource.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-container">
      <header class="top-header">
        <div class="logo-area">
          <h1 class="logo">ABC<span>.</span></h1>
          <div class="logo-divider"></div>
          <p class="portal-text">Painel Administrativo</p>
        </div>
        <button class="logout-btn-header" id="btn-sair">
          Sair <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </header>
      <div class="dashboard-container">
        <aside class="sidebar"></aside>
        <main class="main-content">
          <div class="page-content-card">
            <div class="page-title">
              <h2>Titulações de Professores</h2>
              <p>Associe os certificados e especializações ao corpo docente.</p>
            </div>
            <div class="filters-row">
              <select class="inline-select" id="filtro-professor">
                <option value="">Selecione o professor...</option>
              </select>
              <select class="inline-select" id="filtro-especializacao">
                <option value="">Selecione a especialização...</option>
              </select>
              <button class="new-btn" id="btn-vincular">
                <i class="fa-solid fa-link"></i> Vincular
              </button>
              <button class="action-btn details" id="btn-recarregar">
                Atualizar
              </button>
            </div>
            <section class="records-list" id="records-list">
              <p>Selecione um professor para ver os vínculos.</p>
            </section>
          </div>
        </main>
      </div>
    </div>
    <script src="./script/global.js" type="module"></script>
    <script
      src="./script/vinculos-professor-especializacao.js"
      type="module"
    ></script>
  </body>
</html>
