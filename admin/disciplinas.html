<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>ABC - Gerenciar Disciplinas</title>
    <link rel="stylesheet" href="../style/global.css" />
    <link rel="stylesheet" href="./style/resource.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="icon" href="./../img/icons/book.png" type="image/x-icon" />
  </head>
  <body>
    <div class="app-container">
      <header class="top-header">
        <div class="logo-area">
          <h1 class="logo">ABC<span>.</span></h1>
          <div class="logo-divider"></div>
          <p class="portal-text">Painel Administrativo</p>
        </div>
        <button class="logout-btn-header" id="btn-sair">
          Sair <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </header>
      <div class="dashboard-container">
        <aside class="sidebar"></aside>
        <main class="main-content">
          <div class="page-content-card">
            <div class="page-header">
              <div class="page-title">
                <h2>Gerenciar Disciplinas</h2>
                <p>
                  Controle as matérias, carga horária e ementa do corpo docente.
                </p>
              </div>
            </div>

            <div class="toolbar">
              <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input
                  type="text"
                  id="input-pesquisa"
                  placeholder="Pesquisar disciplina..."
                />
              </div>

              <button class="new-btn" id="btn-nova-disciplina">
                <i class="fa-solid fa-plus"></i> Nova Disciplina
              </button>
            </div>

            <section class="records-list" id="disciplinas-list">
              <p>Carregando disciplinas...</p>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modal-title">Nova Disciplina</h3>
          <button class="close-modal" id="close-modal">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-section-title first">Estrutura Curricular</div>
          <div class="input-group span-4">
            <label>Nome da Disciplina <span class="required">*</span></label>
            <input type="text" id="input-nome" />
          </div>
          <div class="input-group span-2">
            <label>Carga Horária (h) <span class="required">*</span></label>
            <input type="number" id="input-carga-horaria" min="1" />
          </div>
          <div class="input-group span-6">
            <label>Professor Regente <span class="required">*</span></label>
            <select id="input-fk-professor">
              <option value="">Carregando docentes...</option>
            </select>
          </div>
          <div class="input-group span-6">
            <label>Descrição / Ementa</label>
            <textarea id="input-descricao"></textarea>
          </div>

          <div class="modal-footer-actions">
            <button class="delete-btn" id="btn-excluir-disciplina">
              Excluir
            </button>
            <button class="save-btn" id="btn-salvar-disciplina">
              Salvar Disciplina
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="./script/global.js" type="module"></script>
    <script src="./script/disciplinas.js" type="module"></script>
  </body>
</html>
