<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ABC - Administrador</title>

    <link rel="stylesheet" href="../style/global.css" />
    <link rel="stylesheet" href="./style/main.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="icon" href="./../img/icons/book.png" type="image/x-icon" />
  </head>

  <body>
    <div class="app-container">
      <header class="top-header">
        <div class="logo-area">
          <h1 class="logo">ABC<span>.</span></h1>

          <div class="logo-divider"></div>

          <p class="portal-text">Portal do Administrador</p>
        </div>

        <button class="logout-btn-header" id="btn-sair">
          Sair
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </header>

      <div class="dashboard-container">
        <aside class="sidebar">
          <div class="profile">
            <div class="avatar">
              <i class="fa-solid fa-user-shield"></i>
            </div>

            <h2 id="nome-admin">Administrador</h2>
            <span id="email-admin">admin@escola</span>
          </div>

          <nav class="menu">
            <button class="menu-btn active" id="menu-dashboard">
              <i class="fa-solid fa-table-columns"></i>
              Dashboard
            </button>

            <button class="menu-btn" id="menu-alunos">
              <i class="fa-solid fa-graduation-cap"></i>
              Alunos
            </button>

            <button class="menu-btn" id="menu-professores">
              <i class="fa-solid fa-chalkboard-user"></i>
              Professores
            </button>

            <button class="menu-btn" id="menu-turmas">
              <i class="fa-solid fa-users-rectangle"></i>
              Turmas
            </button>

            <button class="menu-btn" id="menu-disciplinas">
              <i class="fa-solid fa-book-open"></i>
              Disciplinas
            </button>

            <button class="menu-btn" id="menu-especializacoes">
              <i class="fa-solid fa-award"></i>
              Especializacoes
            </button>

            <button class="menu-btn" id="menu-enderecos">
              <i class="fa-solid fa-location-dot"></i>
              Enderecos
            </button>

            <button class="menu-btn" id="menu-telefones-aluno">
              <i class="fa-solid fa-phone"></i>
              Telefones Aluno
            </button>

            <button class="menu-btn" id="menu-telefones-professor">
              <i class="fa-solid fa-phone-volume"></i>
              Telefones Professor
            </button>

            <button class="menu-btn" id="menu-vinculos-turma-disciplina">
              <i class="fa-solid fa-link"></i>
              Turma x Disciplina
            </button>

            <button class="menu-btn" id="menu-vinculos-professor-especializacao">
              <i class="fa-solid fa-diagram-project"></i>
              Professor x Especializacao
            </button>
          </nav>
        </aside>

        <main class="main-content">
          <div class="page-content-card default-card">
            <div class="page-title">
              <h2>Painel Administrativo</h2>
              <p>Visao geral dos cadastros da escola</p>
            </div>

            <section class="cards" id="cards-resumo">
              <p>Carregando resumo...</p>
            </section>

            <section class="actions-grid">
              <button class="quick-action" id="atalho-alunos">
                <i class="fa-solid fa-graduation-cap"></i>
                Gerenciar Alunos
              </button>

              <button class="quick-action" id="atalho-professores">
                <i class="fa-solid fa-chalkboard-user"></i>
                Gerenciar Professores
              </button>

              <button class="quick-action" id="atalho-turmas">
                <i class="fa-solid fa-users-rectangle"></i>
                Gerenciar Turmas
              </button>

              <button class="quick-action" id="atalho-disciplinas">
                <i class="fa-solid fa-book-open"></i>
                Gerenciar Disciplinas
              </button>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="./script/global.js" type="module"></script>
    <script src="./script/main.js" type="module"></script>
  </body>
</html>
