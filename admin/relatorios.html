<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>ABC - Auditoria do Sistema</title>
    <link rel="stylesheet" href="../style/global.css" />
    <link rel="stylesheet" href="./style/resource.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-container">
      <header class="top-header">
        <div class="logo-area">
          <h1 class="logo">ABC<span>.</span></h1>
          <div class="logo-divider"></div>
          <p class="portal-text">Painel Administrativo</p>
        </div>
        <button class="logout-btn-header" id="btn-sair">
          Sair <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </header>
      <div class="dashboard-container">
        <aside class="sidebar"></aside>
        <main class="main-content">
          <div class="page-content-card">
            <div class="page-header">
              <div class="page-title">
                <h2>Logs de Auditoria</h2>
                <p>
                  Rastreabilidade completa de alterações, cadastros e remoções
                  no sistema.
                </p>
              </div>
            </div>

            <div class="toolbar">
              <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input
                  type="text"
                  id="input-pesquisa"
                  placeholder="Filtrar por ação, tabela, descrição ou usuário..."
                />
              </div>
            </div>

            <section class="records-list" id="logs-list">
              <p>Carregando histórico de eventos...</p>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="./script/global.js" type="module"></script>
    <script src="./script/logs.js" type="module"></script>
  </body>
</html>
