<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>ABC - Especializações</title>
    <link rel="stylesheet" href="../style/global.css" />
    <link rel="stylesheet" href="./style/resource.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-container">
      <header class="top-header">
        <div class="logo-area">
          <h1 class="logo">ABC<span>.</span></h1>
          <div class="logo-divider"></div>
          <p class="portal-text">Painel Administrativo</p>
        </div>
        <button class="logout-btn-header" id="btn-sair">
          Sair <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </header>
      <div class="dashboard-container">
        <aside class="sidebar"></aside>
        <main class="main-content">
          <div class="page-content-card">
            <div
              class="page-actions-header"
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
              "
            >
              <div class="page-title" style="margin: 0">
                <h2>Gerenciar Especializações</h2>
                <p>
                  Configure a listagem global de Pós-Graduações, MBAs e
                  Mestrados.
                </p>
              </div>
              <button class="new-btn" id="btn-nova-esp">
                <i class="fa-solid fa-plus"></i> Nova Especialização
              </button>
            </div>
            <div class="toolbar">
              <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i
                ><input
                  type="text"
                  id="input-pesquisa"
                  placeholder="Pesquisar especialização por título..."
                />
              </div>
            </div>
            <section class="records-list" id="esp-list">
              <p>Carregando...</p>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modal-title">Nova Especialização</h3>
          <button class="close-modal" id="close-modal">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="input-group span-2">
            <label>Nome da Titulação <span class="required">*</span></label
            ><input
              type="text"
              id="input-nome"
              placeholder="Ex: MBA em Gestão Escolar"
            />
          </div>
          <div class="input-group">
            <label>Carga Horária (h) <span class="required">*</span></label
            ><input type="number" id="input-carga" min="1" />
          </div>
          <div class="input-group span-3">
            <label>Descrição / Ementa Resumida</label
            ><textarea id="input-descricao"></textarea>
          </div>
          <button class="delete-btn" id="btn-excluir-esp">Excluir</button>
          <button class="save-btn" id="btn-salvar-esp">
            Salvar Especialização
          </button>
        </div>
      </div>
    </div>

    <script src="./script/global.js" type="module"></script>
    <script src="./script/especializacoes.js" type="module"></script>
  </body>
</html>
