<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ABC - Gerenciar Notas</title>

    <link rel="stylesheet" href="../style/global.css" />

    <link rel="stylesheet" href="./style/notas.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="icon" href="./../img/icons/book.png" type="image/x-icon" />
  </head>

  <body>
    <div class="app-container">
      <!-- HEADER -->
      <header class="top-header">
        <div class="logo-area">
          <h1 class="logo">ABC<span>.</span></h1>

          <div class="logo-divider"></div>

          <p class="portal-text">Portal do Professor</p>
        </div>

        <button class="logout-btn-header" id="btn-sair">
          Sair

          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </header>

      <!-- DASHBOARD -->
      <div class="dashboard-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
          <div class="profile">
            <div class="avatar">
              <i class="fa-solid fa-user-tie"></i>
            </div>

            <h2 id="nome-professor">Professor</h2>

            <span> Docente </span>
          </div>

          <nav class="menu">
            <button class="menu-btn" id="menu-dashboard">
              <i class="fa-solid fa-table-columns"></i>

              Dashboard
            </button>

            <button class="menu-btn active" id="menu-lancar-notas">
              <i class="fa-solid fa-pen"></i>

              Gerenciar Notas
            </button>

            <button class="menu-btn" id="menu-perfil">
              <i class="fa-solid fa-user"></i>

              Perfil
            </button>
          </nav>
        </aside>

        <!-- CONTENT -->
        <main class="main-content">
          <div class="page-content-card default-card">
            <div class="page-title">
              <h2>Gerenciar Notas</h2>

              <p>Gerencie as notas das turmas.</p>
              <p>
                <span class="required">Obs:</span> Só é possível editar, ou
                excluidas, notas até 2 dias após o cadastro.
              </p>
            </div>

            <select class="semester" id="select-ano"></select>

            <div class="search-container">
              <i class="fa-solid fa-magnifying-glass"></i>

              <input
                type="text"
                id="input-pesquisa"
                placeholder="Pesquisar aluno..."
              />
            </div>

            <section class="turmas-list" id="turmas-list">
              <p>Carregando turmas...</p>
            </section>
          </div>
        </main>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modal-title">Nova Nota</h3>

          <button class="close-modal" id="close-modal">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="modal-body">
          <div class="input-group">
            <label>
              Nota
              <span class="required">*</span>
            </label>

            <input
              type="number"
              step="0.1"
              min="0"
              max="10"
              id="input-nota"
              oninput="
                if (Number(this.value) > 10) this.value = 10;
                if (Number(this.value) < 0) this.value = 0;
              "
            />
          </div>

          <div class="input-group">
            <label>
              Descrição
              <span class="required">*</span>
            </label>

            <textarea id="input-descricao"></textarea>
          </div>

          <div class="input-group">
            <label>
              Período
              <span class="required">*</span>
            </label>

            <select id="input-periodo">
              <option value="1">1º Período</option>

              <option value="2">2º Período</option>

              <option value="3">3º Período</option>
            </select>
          </div>

          <div class="input-group">
            <label>
              Data Aplicação
              <span class="required">*</span>
            </label>

            <input type="date" id="input-data" />
          </div>

          <button class="delete-btn" id="btn-excluir-nota">Excluir Nota</button>
          <button class="save-btn" id="btn-salvar-nota">Salvar Nota</button>
        </div>
      </div>
    </div>

    <script src="../script/global.js" type="module"></script>
    <script src="./script/global.js" type="module"></script>

    <script src="./script/notas.js" type="module"></script>
  </body>
</html>
