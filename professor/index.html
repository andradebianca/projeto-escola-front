<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ABC - Professor</title>

    <link rel="stylesheet" href="../style/global.css" />

    <link rel="stylesheet" href="./style/main.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="icon" href="./../img/icons/book.png" type="image/x-icon" />
  </head>

  <body>
    <div class="app-container">
      <!-- HEADER -->
      <header class="top-header">
        <div class="logo-area">
          <h1 class="logo">ABC<span>.</span></h1>

          <div class="logo-divider"></div>

          <p class="portal-text">Portal do Professor</p>
        </div>

        <button class="logout-btn-header" id="btn-sair">
          Sair

          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </header>

      <!-- DASHBOARD -->
      <div class="dashboard-container">
        <aside class="sidebar">
          <div class="profile">
            <div class="avatar">
              <i class="fa-solid fa-user-tie"></i>
            </div>
            <h2 id="nome-professor">Professor</h2>
            <span>Docente</span>
          </div>
          <nav class="menu">
            <button class="menu-btn active" id="menu-dashboard">
              <div class="menu-btn-left">
                <i class="fa-solid fa-table-columns"></i>
                Dashboard
              </div>
            </button>
            <button class="menu-btn" id="menu-lancar-notas">
              <div class="menu-btn-left">
                <i class="fa-solid fa-pen"></i>
                Gerenciar Notas
              </div>
            </button>
            <button class="menu-btn" id="menu-perfil">
              <div class="menu-btn-left">
                <i class="fa-solid fa-user"></i>
                Perfil
              </div>
            </button>
          </nav>
        </aside>

        <main class="main-content">
          <div class="page-content-card default-card">
            <div class="page-title">
              <h2>Minhas Disciplinas</h2>
              <p>Gerencie suas turmas e disciplinas</p>
            </div>

            <select
              class="select-ano form-group"
              id="select-ano"
              style="margin-bottom: 20px"
            ></select>

            <section class="cards" id="disciplinas-grid">
              <p>Carregando...</p>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="../script/global.js" type="module"></script>

    <script src="./script/global.js" type="module"></script>

    <script src="./script/main.js" type="module"></script>
  </body>
</html>
