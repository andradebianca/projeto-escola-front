<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="./style/main.css" />
    <link rel="stylesheet" href="./../style/global.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="icon" href="./../img/icons/book.png" type="image/x-icon" />
  </head>
  <body>
    <div class="container">
      <!-- RIGHT (Agora centralizado e principal) -->
      <div class="right">
        <div class="login-box">
          <div class="title">
            <h1>Olá, bem-vindo!</h1>
            <p>Entre com suas credenciais para acessar o portal</p>
          </div>

          <div class="input-group">
            <label>ABC - Login</label>
            <div class="input-box">
              <i class="fa-solid fa-user"></i>
              <input
                id="email"
                type="text"
                placeholder="Digite seu email ou username"
              />
            </div>
          </div>

          <div class="input-group">
            <label>Senha</label>
            <div class="input-box">
              <i class="fa-solid fa-lock"></i>
              <input
                id="senha"
                type="password"
                placeholder="Digite sua senha"
              />
              <i
                class="fa-solid fa-eye-slash toggle-password"
                id="toggle-password"
              ></i>
            </div>
          </div>

          <div class="forgot">
            <a href="./esqueci-senha.html">Esqueci minha senha</a>
          </div>

          <button class="login-btn" id="btn-entrar">Entrar</button>

          <div class="divider">
            <span>ou</span>
          </div>

          <div class="first-access" id="first-access">
            <h2>Primeiro acesso</h2>
            <p>Ainda não possui uma conta? Solicite seu acesso.</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./../script/funcs-global.js"></script>
    <script src="./script/main.js" type="module"></script>
  </body>
</html>
